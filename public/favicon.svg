<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="来路 EchoPath">
  <!--
    来路 EchoPath 的图标：分叉地图的极简版。
      · 左边一条实线 = 已经走过的路（过去）
      · 中间一个实心点 = 现在站的路口
      · 右边三条分叉 = 别人走出的不同方向（未来是迷雾，所以最后一条淡一些）
    配色取自 src/styles.css：纸底 #f7f5f1 / 墨 #1c1b19 / 现在 #2f5d8a
    （原来的 public/favicon.svg 是 Vite 脚手架自带的紫色 logo，与本产品无关。）
  -->
  <rect width="48" height="48" rx="10" fill="#f7f5f1"/>

  <!-- 过去：一条实线 + 两个节点 -->
  <line x1="7" y1="24" x2="19" y2="24" stroke="#a8a29a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="8.5" cy="24" r="2" fill="#f7f5f1" stroke="#a8a29a" stroke-width="1.6"/>
  <circle cx="15" cy="24" r="2" fill="#f7f5f1" stroke="#a8a29a" stroke-width="1.6"/>

  <!-- 现在：一个实心节点 -->
  <circle cx="24" cy="24" r="5" fill="#2f5d8a"/>

  <!-- 未来：三条分叉 -->
  <path d="M29 24 C 34 24, 34 12, 41 12" stroke="#8a5a2f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M29 24 L 41 24" stroke="#2f6d5a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M29 24 C 34 24, 34 36, 41 36" stroke="#6b4a8a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.72"/>
</svg>
